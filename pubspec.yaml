name: mixlab
description: "Weight-first e-liquid calculator with inventory, cost tracking, and a guided weigh-along mode."
publish_to: 'none'

version: 0.1.0-beta.3+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Top-level key — a sibling of `flutter:`, not nested inside it.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
